[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oc-sort"
version = "0.1.0"
description = "Observation-Centric SORT (OC-SORT) standalone multi-object tracking library"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "scipy",
    "filterpy",
    "lapx",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.16.9",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]
